# One-off bucket creation — MinIO doesn't auto-create buckets. Safe to re-run
# (`mc mb --ignore-existing` no-ops if the bucket is already there).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: query-engine
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-bucket
          # Pinned (2026-08-03) by digest, not tag -- minio/mc doesn't
          # publish clean semver tags matching its own reported version. See
          # Learnings.md's "Dagster control plane scaling on Kubernetes"
          # entry (why every off-the-shelf image here got pinned).
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/lakehouse
          envFrom:
            - secretRef:
                name: minio-credentials
